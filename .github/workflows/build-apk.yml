name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/.android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK
        run: |
          mkdir -p "${HOME}/.android" "${HOME}/.config/.android"
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" || echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"
          sudo chown -R $USER:$USER "$HOME" 2>/dev/null || true

      - name: Prepare Android User Home & Debug Keystore
        run: |
          mkdir -p "${ANDROID_USER_HOME}"
          keytool -genkey -v -keystore "${ANDROID_USER_HOME}/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la "${ANDROID_USER_HOME}"

      - name: Make scripts executable
        run: |
          chmod +x android/gradlew
          chmod +x scripts/native/build-proot-runtime.sh

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anti-horus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
